name: Daily analytics

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Generate daily analytics
        run: python -m src.worker
      - name: Commit changed artifacts
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- data/json data/csv DASHBOARD.md
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: daily analytics $(TZ=Asia/Jakarta date +%F)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
