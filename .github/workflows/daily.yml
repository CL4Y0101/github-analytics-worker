name: Daily analytics

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Generate daily analytics
        run: python -m src.worker
      - name: Commit daily artifacts and activity
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- data/json data/csv DASHBOARD.md
          git config user.name "CL4Y0101"
          git config user.email "55129345+CL4Y0101@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily analytics $(date +%F)"
          fi
          python -m src.activity
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
