[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-analytics-worker"
version = "0.1.0"
description = "Deterministic daily analytics processing with JSON, CSV, and Markdown outputs"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
